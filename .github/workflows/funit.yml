name: FUnit

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '.github/**' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '.github/**' ]

jobs:
  funit:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x.x

    - name: Tests
      run: |
        dnx -y FUnit.Run -- -c ${{ matrix.configuration }} -md >> $GITHUB_STEP_SUMMARY
